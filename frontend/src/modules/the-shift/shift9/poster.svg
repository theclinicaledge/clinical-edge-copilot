  <title id="title">A telemetry central monitor and a quiet call light</title>
  <desc id="desc">Original fictional illustration. A central monitor shows three rooms: Room 21 has wavy artifact, then a flat line under a gold LEADS OFF alarm; Room 22 shows a calm-looking regular trace; Room 23 shows an irregular trace. Beside it, Room 22's call light glows softly. Not a patient recording.</desc>
